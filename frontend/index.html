<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Receipt System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body { background: #f4f6f9; }
    .login-card { max-width: 440px; width: 100%; }
    .brand-icon { font-size: 2rem; color: #0d6efd; }
</style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="card shadow-sm login-card">
    <div class="card-body p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="brand-icon mb-2"><i class="bi bi-receipt-cutoff"></i></div>
        <h5 class="mb-1">Receipt Management System</h5>
        <p class="text-muted small mb-0">Sign in to continue</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" autocomplete="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
          Sign In
        </button>
      </form>

      <div id="alertBox" class="alert d-none mt-3 mb-0" role="alert"></div>

    </div>
  </div>
</div>
<!----------mid screen-->
<div class="container">
  <div class="row">
    <div class="col-md-4">Takes 4/12 space</div>
    <div class="col-md-8">Takes 8/12 space</div>
  </div>
</div>

<!----------large  screen-->
<div class="container">
  <div class="row">
    <div class="col-lg-6">Takes 4/12 space</div>
    <div class="col-lg-10">Takes 8/12 space</div>
  </div>
</div>

<!----------small  screen-->
<div class="container">
  <div class="row">
    <div class="col-sm-5">Takes 4/12 space</div>
    <div class="col-sm-7">Takes 8/12 space</div>
  </div>
</div>
<div class="container">
  <div class="row">
    <div class="col">1/3 width</div>
    <div class="col">1/3 width</div>
    <div class="col">1/3 width</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>

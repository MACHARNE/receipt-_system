<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Receipt — Receipt System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="./css/app.css" rel="stylesheet"><link href="./css/print.css" rel="stylesheet" media="print">
<style>.receipt-sheet{max-width:720px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:.5rem;overflow:hidden}.receipt-header,.receipt-body{padding:1.25rem 1.5rem}.receipt-totals{background:#f9fafb;padding:1rem 1.25rem;border-radius:.5rem}.receipt-totals .row-line{display:flex;justify-content:space-between;padding:.2rem 0}.receipt-totals .grand{font-weight:700;font-size:1.1rem;border-top:1px solid #e5e7eb;padding-top:.5rem;margin-top:.25rem}.company-logo{max-width:72px;max-height:56px;object-fit:contain}.receipt-qr{width:92px;height:92px;object-fit:contain}</style></head>
<body class="bg-light"><nav class="navbar navbar-dark app-navbar d-print-none"><div class="container-fluid"><a class="navbar-brand mb-0 h1" href="/dashboard.html"><i class="bi bi-receipt-cutoff me-1"></i> Receipt System</a><div class="d-flex align-items-center gap-3"><span class="nav-user" id="navUser">Loading…</span><button class="btn btn-sm btn-outline-light" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i> Logout</button></div></div></nav>
<main class="container py-4"><div class="page-header d-print-none"><div><h4>Receipt</h4><div class="text-muted small" id="receiptSummary">Loading…</div></div><div class="d-flex gap-2 flex-wrap"><a href="/receipts.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> All receipts</a><button class="btn btn-outline-danger btn-sm d-none" id="voidBtn"><i class="bi bi-slash-circle me-1"></i> Void</button><a class="btn btn-outline-primary btn-sm" id="pdfBtn" href="#"><i class="bi bi-file-earmark-pdf me-1"></i> Download PDF</a><a class="btn btn-outline-primary btn-sm" id="duplicateBtn" href="#" title="Start a new receipt with the same items and details"><i class="bi bi-files me-1"></i> Create another like this</a><button class="btn btn-primary btn-sm" id="printBtn"><i class="bi bi-printer me-1"></i> Print</button></div></div><div id="pageAlert" class="alert d-none d-print-none" role="alert"></div>
<article class="receipt-sheet" id="receiptSheet"><header class="receipt-header" id="receiptHeader"><div class="d-flex justify-content-between align-items-start"><div class="d-flex align-items-start gap-3"><img id="companyLogo" class="company-logo d-none" alt="Company logo"><div><div id="companyName" class="fw-bold fs-5">—</div><div id="companyAddress" class="small opacity-75"></div><div id="companyContact" class="small opacity-75"></div></div></div><div class="text-end small"><div class="fw-semibold">Receipt</div><div id="receiptNumber">—</div><div id="receiptDate">—</div></div></div></header>
<div class="receipt-body"><section class="mb-3"><div class="text-muted small">Customer</div><div id="rcCustomer" class="fw-semibold">—</div><div id="rcCustomerPhone" class="small"></div></section><div id="dynamicFieldsBlock" class="mb-3"></div><table class="table table-sm mb-3"><thead><tr><th>Item</th><th class="text-end">Qty</th><th class="text-end">Price</th><th class="text-end">Total</th></tr></thead><tbody id="rcItemsBody"></tbody></table><section class="receipt-totals"><div class="row-line"><span>Subtotal</span><span id="rcSubtotal">—</span></div><div class="row-line"><span>Discount</span><span id="rcDiscount">—</span></div><div class="row-line grand"><span>Total</span><span id="rcTotal">—</span></div><div class="row-line"><span>Paid</span><span id="rcPaid">—</span></div><div class="row-line"><span>Balance</span><span id="rcBalance">—</span></div><div class="row-line"><span>Payment method</span><span id="rcMethod">—</span></div></section><section class="d-flex align-items-center justify-content-between mt-3" id="qrBlock"><div class="text-muted small">Scan to verify this receipt</div><img id="receiptQr" class="receipt-qr" alt="Receipt verification QR code"></section><div class="mt-3 text-muted small" id="rcFooter"></div></div></article></main>
<div class="toast-container position-fixed top-0 end-0 p-3 d-print-none" id="toastContainer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="./js/api.js"></script><script src="./js/receipt-view.js"></script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Verification results should never be indexed by a search engine. -->
<meta name="robots" content="noindex, nofollow">
<title>Verify Receipt — Receipt System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f4f6f9; }
  .verify-card { max-width: 560px; width: 100%; }
  .verify-icon { font-size: 2.75rem; line-height: 1; }
  .verify-row {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .7rem 0; border-bottom: 1px solid #eef0f3;
  }
  .verify-row:last-child { border-bottom: 0; }
  .verify-label { color: #6b7280; }
  .verify-value { font-weight: 600; text-align: right; word-break: break-word; }
  .status-pill {
    display: inline-block; padding: .15rem .6rem;
    border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .02em;
  }
</style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="card shadow-sm verify-card">
    <div class="card-body p-4 p-md-5">

      <div id="stateLoading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
        <p class="text-muted mt-3 mb-0">Checking this receipt…</p>
      </div>

      <div id="stateResult" class="d-none text-center">
        <div id="resultIcon" class="verify-icon mb-2"></div>
        <h4 id="resultTitle" class="mb-1">—</h4>
        <p id="resultMessage" class="text-muted mb-4">—</p>
      </div>

      <div id="resultDetails" class="d-none"></div>

    </div>
  </div>
</div>

<!-- Absolute path: this page is served at /verify/<token>, so a relative
     path would resolve to /verify/js/... and 404. -->
<script src="/js/verify.js"></script>
</body>
</html>
